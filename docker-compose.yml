name: mindexer

services:
  mindexer:
    container_name: mindexer
    image: ghcr.io/dflexy/dfindexer:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${MINDEXER_PORT:-7006}:7006"
    environment:
      PORT: "7006"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FLARESOLVERR_ADDRESS: http://flaresolverr:8191
      FLARESOLVERR_TIMEOUT: "45000"
      FLARESOLVERR_MAX_TIMEOUT: "45000"
      FLARESOLVERR_MAX_SESSIONS: "2"
      FLARESOLVERR_SESSION_TTL: 15m
      LOG_LEVEL: "1"
      LOG_FORMAT: console
    mem_limit: 1024m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./mindexer:/app
    depends_on:
      redis:
        condition: service_started
      flaresolverr:
        condition: service_started
    networks:
      net-mindexer:
        ipv4_address: 172.50.0.102

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-America/Sao_Paulo}
      BROWSER_TIMEOUT: "45000"
    cpus: 1.5
    mem_limit: 1536m
    mem_reservation: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      net-mindexer:
        ipv4_address: 172.50.0.101

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    mem_limit: 1024m
    volumes:
      - ./prowlarr:/config
    networks:
      net-mindexer:
        ipv4_address: 172.50.0.103

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 768m
    volumes:
      - ./redis/data:/data
    networks:
      net-mindexer:
        ipv4_address: 172.50.0.100

networks:
  net-mindexer:
    name: mindexer_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/24
          gateway: 172.50.0.1
